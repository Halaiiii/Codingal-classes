<!DOCTYPE html>
<html>

<head>
    <title>My superhero Card</title>
    <style>
        body {
            background-color: darkblue;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero-name {
            font-size: 60px;
            font-weight: bold;
            color: yellow;
            text-shadow: 3px 3px 4px orange;
        }


        .tagline {
            font-style: italic;
            color: lightblue;
            text-transform: capitalize;
        }

        .label {
            text-transform: uppercase;
            text-decoration: underline;
            color: coral;
        }

        .power {
            font-weight: bold;
            color: lightgreen;
        }

        .weakness {
            text-decoration: line-through;
            color: gray;
        }

        .badge {
            font-size: 28px;
            font-weight: bold;
            color: gold;
            transform: rotate(15deg);
        }

        .made-by {
            color: coral;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1 class="hero-name">
        Thunder kid</h1>
    <p class="tagline">The most Powerful Hero in school</p>

    <h2 class="label">
        Super Powers</h2>
    <p class="power">
        Can Lift a school Bus
    <p class="power">
        Can Run faster than a cheetah

    <h2 class="label">
        Weaknesses</h2>
    <p class="weakness">
        Broccoli
    </p>
    <p class="weakness">Matths Homework</p>

    <p class="badge">Top Hero</p>

    <p class="made-by">
        Created by:Hastee Halai
    </p>

</body>

</html>
